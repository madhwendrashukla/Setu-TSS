# ─── The Startup School — nginx configuration ────────────────────────────────
# Architecture: path-based reverse proxy on a single domain
#   /api/*  → Express backend  (port 5000)
#   /*      → Next.js frontend (port 3000)
#
# Prerequisites on the VPS:
#   1. Install nginx: sudo apt install nginx
#   2. Place this file at: /etc/nginx/sites-available/setustartupschool.com
#   3. Enable: sudo ln -sf /etc/nginx/sites-available/setustartupschool.com \
#                         /etc/nginx/sites-enabled/
#   4. Test: sudo nginx -t
#   5. Reload: sudo systemctl reload nginx
#   6. SSL: sudo certbot certonly --nginx -d setustartupschool.com -d www.setustartupschool.com -d thestartupschool.in -d www.thestartupschool.in -d foundersschool.in -d www.foundersschool.in --expand
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate Limiting & Concurrency Zones (Perimeter DDoS & Stream Shield) ─────────
# 10MB memory zone holds ~160,000 active IP state records
limit_req_zone $binary_remote_addr zone=helpdesk_req_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=helpdesk_conn_limit:10m;

# ── Upstream targets ──────────────────────────────────────────────────────────
upstream tss_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream tss_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream jj_lms {
    # LMS Docker container: -p 127.0.0.1:3001:3000 (loopback-only)
    server 127.0.0.1:3001;
    keepalive 64;
}

# ── HTTP (Port 80) → HTTPS Redirection ───────────────────────────────────────
# Captures all incoming HTTP traffic across all domains and redirects to canonical https://setustartupschool.com
server {
    listen 80;
    listen [::]:80;
    server_name 
        setustartupschool.com 
        www.setustartupschool.com 
        thestartupschool.in 
        www.thestartupschool.in 
        foundersschool.in 
        www.foundersschool.in;

    server_tokens off;

    # Let's Encrypt challenge passthrough (certbot needs this for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 301 Permanent Redirect to primary HTTPS domain preserving path and query string
    location / {
        return 301 https://setustartupschool.com$request_uri;
    }
}

# ── HTTPS (Port 443) Legacy & Alias Domain 301 Redirection ───────────────────
# Handles SSL handshakes for old domains / www and immediately redirects (301) to canonical https://setustartupschool.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 
        www.setustartupschool.com 
        thestartupschool.in 
        www.thestartupschool.in 
        foundersschool.in 
        www.foundersschool.in;

    server_tokens off;

    # ── SSL Certificates (Updated by Certbot to cover all domain SANs)
    # ssl_certificate     /etc/letsencrypt/live/setustartupschool.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/setustartupschool.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 301 Permanent Redirect preserving path and query parameters
    return 301 https://setustartupschool.com$request_uri;
}

# ── Main HTTPS Server (Canonical: setustartupschool.com) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name setustartupschool.com;

    # ── SSL (certbot fills these in — do NOT manually edit after certbot runs)
    # ssl_certificate     /etc/letsencrypt/live/setustartupschool.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/setustartupschool.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/x-javascript
        text/xml
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Client upload limit (for S3 multipart via admin panel) ────────────────
    client_max_body_size 20M;

    # ── Unauthenticated Helpdesk Stream Ingestion Shield ─────────────────────
    # Drops volumetric floods at port 443 in <5ms without touching Node.js
    location ^~ /api/helpdesk {
        limit_req zone=helpdesk_req_limit burst=2 nodelay;
        limit_conn helpdesk_conn_limit 4;
        limit_req_status 429;
        limit_conn_status 429;

        # Hard perimeter cap: 6MB max (multer accepts 5MB attachment + text fields)
        client_max_body_size 6M;
        client_body_timeout 15s;

        proxy_pass         http://tss_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;
        proxy_cache_bypass    $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ── API → Express backend ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://tss_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (generous for slow DB queries / S3 uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Don't cache API responses
        proxy_cache_bypass    $http_upgrade;
        
        # Security headers (re-injected because add_header drops parent block headers)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; font-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'none'; object-src 'none'; script-src 'none'; script-src-attr 'none'; style-src 'none'; upgrade-insecure-requests; connect-src 'self'" always;
    }

    # ── Uploaded Images → Express backend ─────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://tss_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ── Next.js static assets (aggressive caching) ───────────────────────────
    location /_next/static/ {
        proxy_pass         http://tss_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ── LMS static assets (aggressive caching) ────────────────────────────────
    location /lms/_next/static/ {
        proxy_pass         http://jj_lms;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ── LMS app + API → Docker container ─────────────────────────────────────
    # The LMS is built with basePath /lms, so it expects the /lms prefix:
    # proxy_pass has NO URI suffix on purpose — the path passes through intact.
    # Do NOT change this to http://jj_lms/lms/ (would double-prefix).
    location /lms {
        proxy_pass         http://jj_lms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── All other requests → Next.js frontend ────────────────────────────────
    location / {
        proxy_pass         http://tss_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
